SIMULATION:
  # Agents in the run; more agents create more variety.
  AGENTS: 10
  # Transfer-and-cost steps. The default stays below the finite-money
  # extinction point for the checked-in seed, so final metrics stay meaningful.
  ITERATIONS: 1000
  # Starting resources per agent; higher means more initial wealth.
  INITIAL_RESOURCES: 1000.0
  # Resource floor after costs; higher protects more wealth.
  RESOURCE_FLOOR: 0.0
  # Random seed; changing it creates a different run.
  RANDOM_SEED: 42
  # Transfers draw a variable amount from this inclusive range.
  TRANSFER_AMOUNT_RANGE: [1.0, 10.0]

AGENTS:
  # Giving chance range [0, 1]; 0 never gives and 1 always tries.
  GENEROSITY: [0.0, 1.0]
  # Receiving chance range [0, 1]; 0 never accepts and 1 always tries.
  ACCEPTANCE: [0.0, 1.0]
  # Resources kept after giving; higher makes giving harder.
  MIN_RESOURCES_AFTER_GIVING: 1.0
  # Resources allowed after receiving; higher allows more accumulation.
  MAX_RESOURCES_AFTER_RECEIVING: 10000.0
  # Fixed amount lost per iteration; subtractive cost.
  LIVING_COST: 1.0
  # Risk tolerance range; higher means more willing to act on uncertain trust.
  RISK_TOLERANCE: [0.0, 1.0]

# Turns resources into effective giving and acceptance chances.
AFFORDABILITY:
  # Resources at or below this value get the minimum score.
  MIN_RESOURCES: 50.0
  # Resources at or above this value get the maximum score.
  MAX_RESOURCES: 300.0
  # Minimum score [0, 1] used below MIN_RESOURCES.
  MIN_SCORE: 0.0
  # Maximum score [0, 1] used above MAX_RESOURCES.
  MAX_SCORE: 1.0

# Optional goods market; off keeps the transfer-only model.
MARKET:
  # Turn production, trade, and consumption on.
  ENABLED: false
  # Starting money price per good. The price then adjusts each iteration.
  PRICE: 1.0
  # Fraction of the supply/demand imbalance applied to next iteration's price.
  # 0 keeps the fixed price; values above 0 add simple price discovery.
  PRICE_ADJUSTMENT: 0.1
  # Bounds for the adjusting price.
  MIN_PRICE: 0.1
  MAX_PRICE: 10.0
  # Goods produced per living agent per iteration.
  PRODUCTION_RANGE: [0.0, 2.0]
  # Goods needed per living agent per iteration.
  CONSUMPTION_RANGE: [1.0, 1.0]
  # Money charged per unit of unmet demand at the living-cost step. This is the
  # value of a good: buyers only purchase when the price is at or below it.
  UNMET_DEMAND_PENALTY: 2.0
  # Sellers hold goods rather than sell below this price. 0 sells at any price.
  SELLER_RESERVATION_PRICE: 0.0

# Natural-resource commons and the village fund. Money is not destroyed:
# subsistence payments move to the fund, which pays a dividend back to living
# agents. Goods can also be extracted from the commons, less efficiently than
# buying them.
COMMONS:
  # Initial and maximum raw goods in the commons.
  INITIAL_GOODS: 500.0
  CAPACITY: 500.0
  # Raw goods regenerated per iteration.
  REGENERATION: 5.0
  # Usable goods per raw unit extracted. Below 1 means waste/degradation.
  EXTRACTION_EFFICIENCY: 0.5
  # Maximum usable goods one agent can extract per iteration.
  EXTRACTION_LIMIT: 5.0
  # Money-equivalent effort cost of one extracted good. Buy while the market
  # price is at or below this; extract first when the price is higher.
  EXTRACTION_COST: 1.0
  # Share of the collected fund returned to living agents each iteration.
  # 0.0 keeps the money in the commons; 1.0 rebates all subsistence money.
  FUND_REDISTRIBUTION: 0.0

# Environmental shocks and simple adaptation. Off by default.
SHOCKS:
  ENABLED: false
  # Events keyed by 1-based iteration; type is scarcity or information.
  # Example: [{iteration: 100, type: scarcity, magnitude: 0.5, duration: 10}]
  SCHEDULE: []
  # Risk-tolerance change per iteration when demand is unmet.
  ADAPTATION_RATE: 0.05

# Altruistic gifts and optional reciprocity. Repayments are separate from trade.
SOCIAL:
  # Let recipients repay gifts after a delay.
  RECIPROCITY_ENABLED: false
  # Hidden per-agent chance that a due gift is repaid. Drawing a range makes
  # repayment behaviour heterogeneous, so reputation can actually predict it.
  REPAY_PROBABILITY_RANGE: [0.2, 0.8]
  # Iterations between a gift and its attempted repayment.
  REPAY_DELAY: 3
  # Fraction of the gift returned per attempt.
  REPAY_FRACTION: 1.0
  # Iterations before an unpaid remainder is retried.
  REPAY_RETRY_DELAY: 1
  # Fraction added to the unpaid remainder after each missed attempt. This is a
  # late fee, so defaulting has a real cost and debt does not vanish.
  DEFAULT_PENALTY_RATE: 0.05
  # Stop giving to an agent who defaulted on you until the debt is settled.
  EXCLUDE_DEFAULTERS: true

# Private trust beliefs and noisy public reputation. Off by default.
TRUST:
  # Turn belief and reputation tracking on.
  ENABLED: false
  # Prior belief that another agent will reciprocate, in [0, 1].
  INITIAL_BELIEF: 0.5
  # How quickly beliefs and reputation move toward new evidence.
  LEARNING_RATE: 0.2
  # Per-iteration pull back toward the prior, in [0, 1].
  DECAY: 0.02
  # Standard deviation of noise on public observations.
  NOISE: 0.0
  # Iterations before an observation reaches public reputation.
  DELAY: 0
  # Constant bias added to public observations.
  BIAS: 0.0
  # Weight of public reputation when blending into private belief.
  PUBLIC_WEIGHT: 0.3
  # Blend trust-based receiver selection with legacy scores (0 legacy, 1 trust).
  DECISION_WEIGHT: 0.0
  # Logistic temperature for trust decisions. Lower values make the same
  # expected payoff translate into a sharper choice.
  DECISION_TEMPERATURE: 0.1

# Controls how much past exchanges affect recipient selection.
MEMORY:
  # Number of previous givers remembered; higher means longer memory.
  SIZE: 10
  # Memory preference [0, 1]; 0 ignores memory and 1 relies on it.
  PREFERENCE_FRACTION: 0.5
  # When explicit reciprocity is enabled, memory would reward the same gift a
  # second time. Keep this false unless you deliberately want both channels.
  USE_WITH_RECIPROCITY: false
